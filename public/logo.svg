<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <!-- Badge tricolore -->
  <defs>
    <clipPath id="badge">
      <rect x="0" y="8" width="64" height="64" rx="13"/>
    </clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect x="0"    y="8" width="21.4" height="64" fill="#002395"/>
    <rect x="21.4" y="8" width="21.2" height="64" fill="#F0F0F0"/>
    <rect x="42.6" y="8" width="21.4" height="64" fill="#EF3340"/>
    <rect x="0"    y="8" width="64"   height="64" fill="rgba(0,8,40,0.54)"/>
  </g>
  <text
